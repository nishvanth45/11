<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dugout 11 - Cricket Management Simulation" />
  <meta name="theme-color" content="#0b1410" />
  <title>Dugout 11 | Cricket Management Simulation</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="landing">
    <!-- Title / Logo -->
    <header class="brand">
      <img src="assets/logo.svg" alt="Dugout 11 logo" class="brand-logo" />
      <h1 class="brand-title">DUGOUT <span>11</span></h1>
      <p class="brand-subtitle">Cricket Management Simulation</p>
    </header>

    <!-- Main menu -->
    <nav class="menu" aria-label="Main menu">
      <button class="btn btn-primary" data-action="new-career">New Career</button>
      <button class="btn" data-action="load-career">Load Career</button>
      <button class="btn" data-action="settings">Settings</button>
    </nav>

    <!-- Placeholder message area -->
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Dugout 11</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
